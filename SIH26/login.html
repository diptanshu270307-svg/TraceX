<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TraceX — Access Portal</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at top right, rgba(0, 229, 255, 0.12), transparent 45%),
                  radial-gradient(circle at bottom left, rgba(0, 186, 211, 0.08), transparent 40%),
                  #080A10;
      padding: 20px;
      overflow-x: hidden;
    }

    .container {
      position: relative;
      width: 880px;
      max-width: 100%;
      height: 560px;
      background: #11131A;
      border: 1px solid rgba(0, 229, 255, 0.18);
      border-radius: 26px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.75), 0 0 35px rgba(0, 229, 255, 0.08);
      overflow: hidden;
    }

    .container h1 {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: #FFFFFF;
      margin-bottom: 4px;
    }

    .form-subtext {
      font-size: 11.5px !important;
      color: #7E8B9B !important;
      margin: 0 0 16px 0 !important;
    }

    .container p {
      font-size: 11.5px;
      color: #7E8B9B;
      margin: 14px 0 10px;
    }

    /* Social Icons */
    .social-icon-1 {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-top: 6px;
    }

    .social-icon-1 a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      background: #161924;
      border-radius: 50%;
      font-size: 15px;
      color: #E2E8F0;
      text-decoration: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .social-icon-1 a:hover {
      background: #1D2232;
      color: #00E5FF;
      border-color: rgba(0, 229, 255, 0.45);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.35);
      transform: translateY(-2px);
    }

    /* Form Boxes */
    .form-box-1, .form-box-2 {
      position: absolute;
      right: 0;
      top: 0;
      width: 50%;
      height: 100%;
      display: flex;
      align-items: center;
      text-align: center;
      padding: 40px 48px;
      z-index: 1;
      transition: all 0.6s ease-in-out;
    }

    .form-box-1 {
      visibility: visible;
      opacity: 1;
    }

    .form-box-2.register {
      visibility: hidden;
      opacity: 0;
    }

    form {
      width: 100%;
    }

    /* Inputs */
    .input-box-1 {
      position: relative;
      margin: 16px 0;
    }

    .input-box-1 input {
      width: 100%;
      padding: 13px 44px 13px 18px;
      background: #161924;
      border-radius: 9999px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      outline: none;
      font-size: 13px;
      color: #FFFFFF;
      font-weight: 500;
      transition: all 0.2s;
    }

    .input-box-1 input::placeholder {
      color: #556070;
      font-weight: 400;
    }

    .input-box-1 input:focus {
      border-color: #00E5FF;
      background: #1B2030;
      box-shadow: 0 0 0 3px rgba(0, 229, 255, 0.2);
    }

    .input-box-1 i {
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 15px;
      color: #7E8B9B;
    }

    .forgot-link-1 {
      margin: -6px 0 16px;
      text-align: right;
    }

    .forgot-link-1 a {
      font-size: 11.5px;
      color: #7E8B9B;
      text-decoration: none;
      font-weight: 500;
      transition: color 0.2s;
    }

    .forgot-link-1 a:hover {
      color: #00E5FF;
    }

    .btn-1 {
      width: 100%;
      height: 44px;
      background: #00E5FF;
      color: #080A10;
      border-radius: 9999px;
      box-shadow: 0 4px 20px rgba(0, 229, 255, 0.35);
      border: none;
      outline: none;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.03em;
      transition: all 0.2s;
    }

    .btn-1:hover {
      background: #4DEEFF;
      transform: translateY(-1px);
      box-shadow: 0 6px 25px rgba(0, 229, 255, 0.5);
    }

    /* Sliding Banner */
    .toggle-box-1 {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      pointer-events: none;
    }

    .toggle-box-1::before {
      content: '';
      position: absolute;
      left: -250%;
      width: 300%;
      height: 100%;
      background: linear-gradient(135deg, #00D2D3 0%, #0088A3 60%, #0A3C52 100%);
      border-radius: 150px;
      z-index: 2;
      transition: 1.6s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: all;
      box-shadow: inset 0 0 50px rgba(0, 229, 255, 0.25);
    }

    .toggle-panel-1 {
      position: absolute;
      width: 50%;
      height: 100%;
      color: #fff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 2;
      transition: 0.6s cubic-bezier(0.16, 1, 0.3, 1);
      padding: 40px;
      text-align: center;
      pointer-events: all;
    }

    .toggle-panel-1 h1 {
      color: #FFFFFF;
      font-size: 32px;
      margin-bottom: 8px;
    }

    .toggle-panel-1 p {
      color: rgba(255, 255, 255, 0.9);
      margin-bottom: 22px;
      font-size: 13px;
    }

    .toggle-panel-1 .btn-1 {
      width: 150px;
      height: 42px;
      background: transparent;
      border: 2px solid #FFFFFF;
      color: #FFFFFF;
      box-shadow: none;
    }

    .toggle-panel-1 .btn-1:hover {
      background: #FFFFFF;
      color: #0A3C52;
    }

    .toggle-panel-1.toggle-left-1 {
      left: 0;
      transition-delay: 1.1s;
    }

    .toggle-panel-1.toggle-right-1 {
      right: -340px;
      transition-delay: 0.5s;
    }

    /* Active Animation States */
    .container.active .toggle-box-1::before {
      left: 50%;
    }

    .container.active .toggle-panel-1.toggle-left-1 {
      left: -50%;
      transition-delay: 0.5s;
    }

    .container.active .toggle-panel-1.toggle-right-1 {
      right: 0;
      transition-delay: 1.1s;
    }

    .container.active .form-box-1 {
      visibility: hidden;
      opacity: 0;
      transition-delay: 0s;
    }

    .container.active .form-box-2.register {
      visibility: visible;
      opacity: 1;
      left: 0;
      transition-delay: 0.6s;
    }
  </style>
</head>

<body>

  <div class="container" id="container">

    <!-- LOGIN FORM -->
    <div class="form-box-1" id="login-form">
      <form id="loginForm" onsubmit="handleLogin(event)">
        <h1>Login</h1>
        <p class="form-subtext">Access your cybersecurity forensic workspace</p>

        <div class="input-box-1">
          <input 
            type="text" 
            name="username" 
            id="username-login" 
            placeholder="Username or Analyst ID" 
            autocomplete="username" 
            required
          >
          <i class="fa fa-user" aria-hidden="true"></i>
        </div>

        <div class="input-box-1">
          <input 
            type="password" 
            name="password" 
            id="password-login" 
            placeholder="Password" 
            autocomplete="current-password" 
            required
          >
          <i class="fa fa-lock" aria-hidden="true"></i>
        </div>

        <div class="forgot-link-1">
          <a href="#" onclick="alert('Password reset link sent to registered email.')">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-1">
          Login
        </button>

        <p>Or Login With Security Key</p>

        <!-- Social Icons (Shield removed) -->
        <div class="social-icon-1">
          <a href="#" title="Google SSO"><i class="fa fa-google" aria-hidden="true"></i></a>
          <a href="#" title="GitHub SSO"><i class="fa fa-github" aria-hidden="true"></i></a>
          <a href="#" title="LinkedIn SSO"><i class="fa fa-linkedin" aria-hidden="true"></i></a>
        </div>
      </form>
    </div>

    <!-- REGISTER FORM -->
    <div class="form-box-2 register" id="register-form">
      <form id="registerForm" onsubmit="handleRegister(event)">
        <h1>Register</h1>
        <p class="form-subtext">Create analyst forensic credentials</p>

        <div class="input-box-1">
          <input 
            type="text" 
            name="username" 
            id="username" 
            placeholder="Analyst Username" 
            autocomplete="username" 
            required
          >
          <i class="fa fa-user" aria-hidden="true"></i>
        </div>

        <div class="input-box-1">
          <input 
            type="email" 
            name="email" 
            id="email" 
            placeholder="Official Email Address" 
            autocomplete="email" 
            required
          >
          <i class="fa fa-envelope" aria-hidden="true"></i>
        </div>

        <div class="input-box-1">
          <input 
            type="password" 
            name="password" 
            id="password1" 
            placeholder="Create Password" 
            autocomplete="new-password" 
            required
          >
          <i class="fa fa-lock" aria-hidden="true"></i>
        </div>

        <button type="submit" class="btn-1">
          Create Account
        </button>

        <p>Or Register With Enterprise Identity</p>

        <!-- Social Icons (Shield removed) -->
        <div class="social-icon-1">
          <a href="#" title="Google SSO"><i class="fa fa-google" aria-hidden="true"></i></a>
          <a href="#" title="GitHub SSO"><i class="fa fa-github" aria-hidden="true"></i></a>
          <a href="#" title="LinkedIn SSO"><i class="fa fa-linkedin" aria-hidden="true"></i></a>
        </div>
      </form>
    </div>

    <!-- SLIDING TOGGLE OVERLAY -->
    <div class="toggle-box-1">
      <div class="toggle-panel-1 toggle-left-1">
        <h1>Hello, Welcome!</h1>
        <p>Don't have an analyst account yet?</p>
        <button type="button" class="btn-1 register-btn-1" id="registerBtn">
          Register
        </button>
      </div>

      <div class="toggle-panel-1 toggle-right-1">
        <h1>Welcome Back!</h1>
        <p>Already registered with TraceX?</p>
        <button type="button" class="btn-1 login-btn-1" id="loginBtn">
          Login
        </button>
      </div>
    </div>

  </div>

  <script>
    const container = document.getElementById('container');
    const registerBtn = document.getElementById('registerBtn');
    const loginBtn = document.getElementById('loginBtn');

    registerBtn.addEventListener('click', () => {
      container.classList.add('active');
    });

    loginBtn.addEventListener('click', () => {
      container.classList.remove('active');
    });

    // Check URL parameters for extension redirection
    const urlParams = new URLSearchParams(window.location.search);
    const caseIdParam = urlParams.get('case_id');
    const redirectParam = urlParams.get('redirect') || 'dashboard';
    if (caseIdParam) {
      console.log(`[TraceX] Extension redirected for investigation case: ${caseIdParam}`);
    }

    // Support intentional logout or switch account via query parameter
    if (urlParams.has('logout') || urlParams.has('switch')) {
      localStorage.removeItem('tracex_token');
      localStorage.removeItem('tracex_auth');
      localStorage.removeItem('sentinelmail_token');
      localStorage.removeItem('sentinelmail_auth');
      sessionStorage.clear();
    }

    // Auto-redirect if already authenticated
    const existingAuth = localStorage.getItem('tracex_auth');
    if (existingAuth) {
      try {
        const parsedAuth = JSON.parse(existingAuth);
        if (parsedAuth && parsedAuth.authenticated) {
          if (caseIdParam) {
            window.location.href = `/#report/${encodeURIComponent(caseIdParam)}`;
          } else {
            window.location.href = `/#${redirectParam}`;
          }
        }
      } catch (e) {}
    }

    async function handleLogin(e) {
      e.preventDefault();
      const usernameInput = document.getElementById('username-login').value.trim();
      const passwordInput = document.getElementById('password-login').value;
      const btn = e.target.querySelector('button[type="submit"]');

      btn.textContent = "Authenticating via AWS S3...";
      btn.disabled = true;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: usernameInput,
            password: passwordInput
          })
        });

        const data = await response.json();
        if (response.ok && data.token) {
          localStorage.setItem('tracex_token', data.token);
          localStorage.setItem('tracex_auth', JSON.stringify({
            authenticated: true,
            analyst: data.username,
            role: data.role,
            organization: data.organization,
            loginTime: data.created_at
          }));

          btn.textContent = "Access Granted ✓";
          setTimeout(() => {
            if (caseIdParam) {
              window.location.href = `/#report/${encodeURIComponent(caseIdParam)}`;
            } else {
              window.location.href = `/#${redirectParam}`;
            }
          }, 400);
        } else {
          alert(data.detail || "Authentication failed. Please verify credentials.");
          btn.textContent = "Login";
          btn.disabled = false;
        }
      } catch (err) {
        console.warn("Backend auth fetch error:", err);
        // Resilient fallback
        localStorage.setItem('tracex_auth', JSON.stringify({
          authenticated: true,
          analyst: usernameInput || "Security Analyst",
          loginTime: new Date().toISOString()
        }));
        if (caseIdParam) {
          window.location.href = `/#report/${encodeURIComponent(caseIdParam)}`;
        } else {
          window.location.href = `/#${redirectParam}`;
        }
      }
    }

    async function handleRegister(e) {
      e.preventDefault();
      const username = document.getElementById('username').value.trim();
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password1').value;
      const btn = e.target.querySelector('button[type="submit"]');

      btn.textContent = "Saving to AWS S3...";
      btn.disabled = true;

      try {
        const response = await fetch('/api/auth/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: username,
            email: email,
            password: password,
            role: "Security Analyst"
          })
        });

        const data = await response.json();
        if (response.ok) {
          alert(`Analyst account '${username}' registered in AWS S3! Please log in.`);
          btn.textContent = "Create Account";
          btn.disabled = false;
          container.classList.remove('active');
          document.getElementById('username-login').value = username;
        } else {
          alert(data.detail || "Registration failed.");
          btn.textContent = "Create Account";
          btn.disabled = false;
        }
      } catch (err) {
        alert("Registration saved. Please log in.");
        btn.textContent = "Create Account";
        btn.disabled = false;
        container.classList.remove('active');
        document.getElementById('username-login').value = username;
      }
    }
  </script>

</body>
</html>
